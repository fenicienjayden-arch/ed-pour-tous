<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ed pour tous RDC</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:#fff}header{background:linear-gradient(90deg,#2563eb,#7c3aed);padding:20px;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:15px}.card{background:#1e293b;border-radius:14px;padding:16px;border:1px solid #334155}.btn{background:#2563eb;color:white;border:none;padding:10px;border-radius:8px;width:100%;margin-top:8px;font-weight:bold}input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin:5px 0}.lesson{background:#0f172a;padding:10px;border-radius:8px;margin:6px 0;border-left:4px solid #22c55e}</style></head><body><header><h1>📚 Ed pour tous</h1><p>Primaire • Secondaire • Université - RDC</p><input id="search" placeholder="🔍 Rechercher un cours..." oninput="filter()"></header><div class="grid"><div class="card"><h3>🟢 Primaire</h3><p>Lecture, calcul, sciences</p><button class="btn" onclick="show('primaire')">Ouvrir</button></div><div class="card"><h3>🔵 Secondaire</h3><p>Math, Physique, Histoire RDC</p><button class="btn" onclick="show('secondaire')">Ouvrir</button></div><div class="card"><h3>🟣 Université</h3><p>Droit, Médecine, Info, Éco</p><button class="btn" onclick="show('universite')">Ouvrir</button></div></div><div id="content" style="padding:15px"></div><div style="padding:15px"><div style="background:#1e293b;padding:12px;border-radius:10px"><h3>🤖 Assistant IA</h3><textarea id="q" rows="2" placeholder="Pose ta question scolaire..."></textarea><button class="btn" onclick="askAI()">Demander</button><div id="aiAns" style="margin-top:8px;white-space:pre-wrap"></div></div><p style="text-align:center;margin-top:20px;opacity:.5">© 2026 Ed pour tous - Bunia RDC</p></div><script>const data={primaire:[{t:"Math - Addition",c:"2+3=5. Exercice: 4+6=?"},{t:"Français - Lecture",c:"Voyelles a,e,i,o,u. Mots: Papa, Maman, Ecole."},{t:"Sciences - Corps humain",c:"Tête, 2 bras, 2 jambes."}],secondaire:[{t:"Math - Equations",c:"2x+3=7 => 2x=4 => x=2"},{t:"Biologie - Photosynthèse",c:"Plante: soleil+CO2+eau => O2+sucre. 6CO2+6H2O => C6H12O6+6O2"},{t:"Histoire RDC",c:"Indépendance 30 juin 1960. Lumumba."},{t:"Info - Algorithme",c:"Suite d'étapes pour résoudre problème."}],universite:[{t:"Info - Programmation",c:"HTML structure, CSS décore, JS anime."},{t:"Droit - Constitution",c:"Constitution 2006 garantit droits fondamentaux."},{t:"Médecine - Palu",c:"Plasmodium par moustique. Prévention: moustiquaire."}]};function show(n){let h=`<h2>${n.toUpperCase()}</h2>`;data[n].forEach(l=>h+=`<div class=lesson><b>${l.t}</b><br>${l.c}</div>`);document.getElementById('content').innerHTML=h}function filter(){let v=document.getElementById('search').value.toLowerCase();let all=[...data.primaire,...data.secondaire,...data.universite];let f=all.filter(x=>x.t.toLowerCase().includes(v));if(v.length>1){let h=`<h2>Résultat: ${v}</h2>`;f.forEach(l=>h+=`<div class=lesson><b>${l.t}</b><br>${l.c}</div>`);document.getElementById('content').innerHTML=h}}function askAI(){let q=document.getElementById('q').value;if(!q)return;document.getElementById('aiAns').innerHTML="⏳...";setTimeout(()=>{let r="";if(q.toLowerCase().includes("photo"))r="Photosynthèse: la plante prend soleil+CO2+eau et fabrique sucre+oxygène, comme une cuisine.";else r=`Question: "${q}"\n\nExplication simple avec exemple de Bunia. Dis ta classe pour plus de détails!`;document.getElementById('aiAns').innerHTML=r},700)}</script></body></html>
